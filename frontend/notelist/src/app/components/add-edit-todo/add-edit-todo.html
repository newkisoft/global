<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-header">
          <h4 class="mb-0">
            {{ isEditMode ? 'Edit TODO' : 'Add TODO' }}
          </h4>
        </div>

        <div class="card-body">

          <form (ngSubmit)="SaveTodo(todoItem())">
           
            <div class="mb-3">
              <label for="title" class="form-label">
                Title
              </label>

              <input
                id="title"
                type="text"
                class="form-control"
                [(ngModel)]="todoItem().title"
                name="title"
                placeholder="Enter todo title"
                required
              />
            </div>

            <!-- Completed -->
            <div class="mb-3 form-check">
              <input
                id="completed"
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="todoItem().completed"
                name="completed"
              />

              <label for="completed" class="form-check-label">
                Completed
              </label>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-end gap-2">

              <button
                type="button"
                class="btn btn-secondary"
                routerLink="/todos">
                Cancel
              </button>

              <button
                type="submit"
                class="btn btn-primary">
                {{ isEditMode ? 'Update TODO' : 'Add TODO' }}
              </button>

            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
