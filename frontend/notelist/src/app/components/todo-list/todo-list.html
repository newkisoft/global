<div class="row justify-content-center">
<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Completed</th>
        </tr>
    </thead>
    
    <tbody>
        @for (todo of list(); track todo.id) {

        <tr>
            <td>{{todo.id}}</td>
            <td>{{todo.title}}</td>
            <td>
            <input 
              type="checkbox" 
              class="form-check-input" 
              [checked]="todo.completed"
              (change)="toggleCompletion(todo)"
            />
            </td>
            <td class="text-center">                
                <a [routerLink]="['/todo']" [queryParams]="{ id: todo.id }" class="btn btn-sm btn-outline-primary">    Edit  </a>
              </td>
        </tr>
        
        }
    </tbody>
</table> 
</div>
